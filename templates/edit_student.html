{% extends "base.html" %}
{% block content %}
<h2>Edit Student</h2>
<form method="POST">
    Name: <input type="text" name="name" value="{{ student.name }}"><br><br>
    Career:
    <select name="career_id">
        {% for c in careers %}
            <option value="{{c.id}}" {% if c.id == student.career_id %}selected{% endif %}>{{c.name}}</option>
        {% endfor %}
    </select><br><br>
    <input type="submit" value="Update Student">
</form>
{% endblock %}
