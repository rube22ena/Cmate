{% extends "base.html" %}
{% block content %}
<h2>Add Student</h2>
<form method="POST">
    Name: <input type="text" name="name"><br><br>
    Career:
    <select name="career_id">
        {% for c in careers %}
            <option value="{{c.id}}">{{c.name}}</option>
        {% endfor %}
    </select><br><br>
    <input type="submit" value="Add Student">
</form>
{% endblock %}
